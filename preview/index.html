// ---------- QR scanner: a phone (iPhone, Android, any browser) pairs by scanning the computer's QR code ----------
// Android has a built-in detector (BarcodeDetector); iPhone Safari does not, so jsQR (utils/jsqr.js, kept offline) reads the camera frames.
const QrScan = {
  lib: null,
  load() {
    if (window.jsQR) return Promise.resolve();
    return this.lib || (this.lib = new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'utils/jsqr.js'; s.onload = ok; s.onerror = () => { this.lib = null; no(new Error(t('Could not open the camera'))); }; document.head.appendChild(s); }));
  },
  async native() {
    try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) return new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}
    return null;
  },
  // One picture (video frame or image) → the text in its QR code, or ''
  async read(src, w, h, det) {
    if (det) { try { const r = await det.detect(src); if (r[0] && r[0].rawValue) return r[0].rawValue; } catch (e) {} }
    if (!window.jsQR || !w || !h) return '';
    const s = Math.min(1, 800 / Math.max(w, h)), c = this.cv || (this.cv = document.createElement('canvas'));
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(src, 0, 0, c.width, c.height);
    const r = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    return r && r.data || '';
  },
  // A photo from the camera app or the gallery (used when the live camera is not available)
  photo(capture) {
    return new Promise(resolve => {
      const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (capture) i.capture = 'environment';
      i.onchange = async () => {
        const f = i.files && i.files[0]; if (!f) return resolve('');
        try {
          await this.load().catch(() => {});
          const url = URL.createObjectURL(f), img = await loadImg(url);
          const txt = await this.read(img, img.naturalWidth || img.width, img.naturalHeight || img.height, await this.native());
          URL.revokeObjectURL(url); resolve(txt);
        } catch (e) { resolve(''); }
      };
      i.click();
    });
  },
  // Live camera with a square frame; resolves with the QR text, or null when closed
  scan() {
    const live = window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    if (!live) return this.photo(true).then(x => x || (toast(t('No QR code found in the photo')), null));
    return new Promise(async resolve => {
      $overlay.innerHTML = `<div class="scanner">
        <video id="qrVideo" autoplay playsinline muted></video>
        <div class="sc-top"><span class="sc-x" id="qrClose">${ic('x', '#fff', 20, 2.6)}</span><span>${esc(t('Scan the QR code on the computer'))}</span><span style="width:36px"></span></div>
        <div class="sc-frame sq"><i class="k1"></i><i class="k2"></i><i class="k3"></i><i class="k4"></i><div class="sc-laser"></div></div>
        <div class="sc-hint" id="qrHint">${esc(t('On the computer open Trade → Settings → Use on another device, then point the camera at the QR code'))}</div>
        <div class="sc-bar"><span class="sc-side" id="qrGallery">${ic('image', '#fff', 22)}</span><span></span><span style="width:46px"></span></div>
      </div>`;
      let stream = null, done = false;
      const finish = v => { if (done) return; done = true; if (stream) stream.getTracks().forEach(tr => tr.stop()); closeOverlay(); resolve(v); };
      document.getElementById('qrClose').onclick = () => finish(null);
      document.getElementById('qrGallery').onclick = async () => { const x = await this.photo(false); if (x) finish(x); else toast(t('No QR code found in the photo')); };
      const det = await this.native();
      if (!det) this.load().catch(() => {});
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
        const v = document.getElementById('qrVideo');
        if (!v || done) { stream.getTracks().forEach(tr => tr.stop()); return; }
        v.srcObject = stream; if (v.play) v.play().catch(() => {});
        const tick = async () => {
          if (done) return;
          if (!document.getElementById('qrVideo')) return finish(null);
          if (v.readyState >= 2 && v.videoWidth) { const x = await this.read(v, v.videoWidth, v.videoHeight, det); if (x) { if (navigator.vibrate) navigator.vibrate(60); return finish(x); } }
          setTimeout(tick, 180);
        };
        tick();
      } catch (e) {
        const h = document.getElementById('qrHint');
        if (h) h.innerHTML = `<b>${esc(t('Could not open the camera'))}</b><br>${esc(t('Allow the camera for Trade, or pick a photo of the QR code from the gallery.'))}`;
      }
    });
  },
  // Scan, then connect with what the code holds: the pairing link (computer address + key), the key alone, or the 6 digits
  async pair() {
    const txt = String(await this.scan() || '').trim();
    if (!txt) return false;
    const m = /^\s*(\S+?)\/?#(?:.*&)?pair=([\w-]+)/.exec(txt);
    if (window.TradeApp) {
      // Android app: remember the computer's address from the link
      const link = TradeApp.parseLink(txt);
      if (link) TradeApp.setServer(link.server);
      else if (!/^\d{6}$|^[\w-]{8,}$/.test(txt)) throw new Error(t('This QR code is not from the Trade computer'));
      await Sync.connect(link ? link.key : txt);
      return true;
    }
    const key = m ? m[2] : /^\d{6}$|^[\w-]{8,}$/.test(txt) ? txt : '';
    if (!key) throw new Error(t('This QR code is not from the Trade computer'));
    try { await Sync.connect(key); return true; }
    catch (e) {
      // A browser tab opened from another address: open the computer's own link instead (it pairs by itself).
      // Not inside the installed iPhone app — leaving its address would start an empty app.
      let other = '';
      try { other = m && new URL(m[1].replace(/\/?$/, '/')).origin; } catch (x) {}
      if (other && other !== location.origin && !Install.standalone()) { location.href = txt; return false; }
      throw e;
    }
  }
};

// ---------- Permanent storage ----------
// 1. The browser is asked to never clear this app's database (granted for installed apps; on the first tap if a tap is needed).
// 2. Optional: a folder on this device where the whole database is saved as a real file after every change
//    (Trade-data.json + one copy per day). Survives clearing the browser and uninstalling the app.
const Folder = {
  handle: null, perm: '', timer: null, error: '',
  supported: () => !!window.showDirectoryPicker && !!DB.db,
  async init() {
    this.handle = DB.kv.folder && DB.kv.folder.getFileHandle ? DB.kv.folder : null;
    if (this.handle) try { this.perm = await this.handle.queryPermission({ mode: 'readwrite' }); } catch (e) { this.perm = 'denied'; }
  },
  async choose() {
    let h;
    try { h = await window.showDirectoryPicker({ id: 'trade-data', mode: 'readwrite', startIn: 'documents' }); } catch (e) { return false; }
    this.handle = h; this.perm = 'granted';
    await DB.setKV('folder', h);
    await this.save();
    return true;
  },
  async allow() {
    if (!this.handle) return false;
    try { this.perm = await this.handle.requestPermission({ mode: 'readwrite' }); } catch (e) { this.perm = 'denied'; }
    if (this.perm === 'granted') await this.save();
    return this.perm === 'granted';
  },
  schedule() { if (!this.handle) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.save(), 2500); },
  async save() {
    if (!this.handle || this.perm !== 'granted') return;
    try {
      const text = JSON.stringify(backupData());
      for (const name of ['Trade-data.json', 'Trade-' + TradeReport.ymd(Date.now()) + '.json']) {
        const f = await this.handle.getFileHandle(name, { create: true }), w = await f.createWritable();
        await w.write(text); await w.close(); // written to a temp file, swapped in on close
      }
      this.error = '';
      await DB.setKV('folderSaved', Date.now());
    } catch (e) { this.error = e.message || String(e); }
  },
  async off() { this.handle = null; this.perm = ''; delete DB.kv.folder; await DB.write('kv', 'delete', 'folder'); }
};
const Persist = {
  ok: false,
  async check() { try { this.ok = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); } catch (e) {} return this.ok; },
  async ask() { try { if (navigator.storage && navigator.storage.persist) this.ok = await navigator.storage.persist() || this.ok; } catch (e) {} return this.ok; }
};
// Some browsers only grant permanent storage (and folder access) after a tap — ask on the first one
document.addEventListener('pointerdown', function firstTap() {
  document.removeEventListener('pointerdown', firstTap, true);
  if (Folder.handle && Folder.perm === 'prompt') Folder.allow();
  if (!Persist.ok) Persist.ask();
}, true);

async function backup() {
  const data = backupData();

  const name = 'Trade-backup-' + TradeReport.ymd(Date.now()) + '.json';
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /android|iphone|ipad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) { if (e.name === 'AbortError') return; saveFile(blob, name); }
  } else saveFile(blob, name);
  await DB.setKV('lastBackup', Date.now());
  doneSheet(t('Backup saved ✓'), `<div class="file"><div class="ex-icon">${ic('shield', B(), 20)}</div><div style="flex:1;min-width:0"><div class="file-name ellipsis" data-notr>${esc(name)}</div><div class="hint">${fmtSize(blob.size)} · ${esc(plural(data.products.length, 'product'))} · ${esc(t('{n} photos', { n: photoCount(data.products) }))}</div></div></div>

async function restoreFile(e) {

  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { return toast(t('This is not a Trade backup file')); }
  restorePreview(data, f.name);
}
// What a backup would change on this device: new / changed / same
function restoreDiff(data) {
  const out = {};
  for (const k of SYNC_KINDS) {
    const list = Array.isArray(data[k]) ? data[k].filter(x => x && x.id) : [];
    let add = 0, upd = 0, same = 0;
    list.forEach(x => {
      const l = k === 'markets' ? DB.markets.find(m => m.id === x.id || m.name.toLowerCase() === norm(x.name).toLowerCase()) : DB[k].find(y => y.id === x.id);
      if (!l) add++;
      else if (k !== 'markets' && JSON.stringify(Object.assign({}, l, { updatedAt: 0 })) !== JSON.stringify(Object.assign({}, x, { updatedAt: 0, _rev: undefined }))) upd++;
      else same++;
    });
    const ids = new Set(list.map(x => x.id)), names = new Set(list.map(x => norm(x.name).toLowerCase()));
    // a kind the backup does not have (e.g. Trash in an older backup) is left as it is
    const extra = !Array.isArray(data[k]) ? 0 : DB[k].filter(x => !(ids.has(x.id) || (k === 'markets' && names.has(x.name.toLowerCase())))).length;
    out[k] = { list, add, upd, same, extra };
  }
  return out;
}
async function restorePreview(data, source) {
  if (!data || data.app !== 'trade' || !Array.isArray(data.products)) return toast(t('This is not a Trade backup file'));
  const diff = restoreDiff(data);
  let mode = 'merge';
  const row = (icon, k, d) => `<div class="rp-row"><div class="bk-sic">${ic(icon, B(), 15)}</div><div style="flex:1;min-width:0"><b>${esc(t(k))}</b><span>${d.list.length}</span></div>

  const paint = () => {
    const extra = SYNC_KINDS.reduce((n, k) => n + diff[k].extra, 0);
    $overlay.innerHTML = `<div class="mask bottom" id="rpm"><div class="sheet rp" onclick="event.stopPropagation()"><div class="grip"></div>
      <div class="rp-head"><div class="bk-orb sm">${ic('upload', '#fff', 20, 2.4)}</div><div style="flex:1;min-width:0;text-align:left">
        <div class="sheet-title" style="margin:0">${esc(t('Restore backup'))}</div>
        <div class="hint ellipsis" data-notr>${esc(source)}${data.exportedAt ? ' · ' + esc(TradeReport.dateTimeLabel(data.exportedAt)) : ''}</div></div></div>
      <div class="rp-rows">${row('box', 'Products', diff.products)}${row('market', 'Markets', diff.markets)}${row('heart', 'Wishlist', diff.wishes)}</div>
      <div class="rp-modes">
        <div class="rp-mode ${mode === 'merge' ? 'on' : ''}" data-m="merge"><span class="rp-radio"></span><div><b>${esc(t('Add to what I have'))}</b><span>${esc(t('New items are added, newer versions are kept. Nothing is removed.'))}</span></div></div>
        <div class="rp-mode ${mode === 'replace' ? 'on danger' : ''}" data-m="replace"><span class="rp-radio"></span><div><b>${esc(t('Make it exactly the backup'))}</b><span>${esc(extra ? t('{n} items that are not in the backup will be removed — also from the computer and other devices.', { n: extra }) : t('Every item is set back to the backup version.'))}</span></div></div>
      </div>
      <div class="sheet-actions"><button class="btn" id="rpNo">${esc(t('Cancel'))}</button><button class="btn ${mode === 'replace' ? 'danger' : 'primary'}" id="rpGo">${ic('check', mode === 'replace' ? '#E11D48' : '#fff', 17, 2.8)}${esc(t('Restore'))}</button></div>
    </div></div>`;
    document.getElementById('rpm').onclick = closeOverlay;
    document.getElementById('rpNo').onclick = closeOverlay;
    $overlay.querySelectorAll('.rp-mode').forEach(m => m.onclick = () => { mode = m.dataset.m; paint(); });
    document.getElementById('rpGo').onclick = () => applyRestore(diff, mode);
  };
  paint();
}
async function applyRestore(diff, mode) {
  const total = SYNC_KINDS.reduce((n, k) => n + diff[k].list.length + (mode === 'replace' ? diff[k].extra : 0), 0) || 1;
  $overlay.innerHTML = `<div class="mask"><div class="busy"><div class="bk-orb spin">${ic('refresh', '#fff', 22, 2.4)}</div>
    <div class="busy-title">${esc(t('Restoring…'))}</div>
    <div class="bar big"><div class="fill" id="prog" style="width:0%"></div></div><div class="hint" id="progt">0 / ${total}</div></div></div>`;
  let done = 0, added = 0, updated = 0, removed = 0;
  const tick = () => { done++; if (done % 3 && done !== total) return; const f = document.getElementById('prog'), x = document.getElementById('progt'); if (f) f.style.width = Math.round(done / total * 100) + '%'; if (x) x.textContent = done + ' / ' + total; };
  try {
    for (const k of SYNC_KINDS) {
      const { list } = diff[k];
      for (const raw of list) {
        const rec = Object.assign({}, raw); delete rec._rev;
        if (k === 'markets') {
          const ex = DB.markets.find(m => m.id === rec.id || m.name.toLowerCase() === norm(rec.name).toLowerCase());
          if (!ex) { DB.markets.push(rec); await DB.write('markets', 'put', rec); added++; }
          else if (mode === 'replace' && ex.id === rec.id && JSON.stringify(ex) !== JSON.stringify(rec)) { Object.assign(ex, rec); await DB.write('markets', 'put', ex); updated++; }
        } else {
          const i = DB[k].findIndex(x => x.id === rec.id), local = i >= 0 ? DB[k][i] : null;
          if (!local) { DB[k].push(rec); await DB.write(k, 'put', rec); added++; }
          else if (JSON.stringify(Object.assign({}, local, { updatedAt: 0 })) !== JSON.stringify(Object.assign({}, rec, { updatedAt: 0 }))
            && (mode === 'replace' || (Number(rec.updatedAt) || 0) >= (Number(local.updatedAt) || 0))) { DB[k][i] = rec; await DB.write(k, 'put', rec); updated++; }
        }
        tick();
      }
      if (mode === 'replace' && diff[k].extra) {
        const ids = new Set(list.map(x => x.id)), names = new Set(list.map(x => norm(x.name).toLowerCase()));
        for (const x of DB[k].filter(x => !(ids.has(x.id) || (k === 'markets' && names.has(x.name.toLowerCase()))))) {
          DB[k] = DB[k].filter(y => y !== x); await DB.write(k, 'delete', x.id); removed++; tick();
        }
      }
    }
  } catch (e) { closeOverlay(); return dialog({ title: t('Restore failed'), text: e.message, ok: t('OK'), cancel: false }); }
  Sync.soon(300);
  doneSheet(t('Restored ✓'), `<div class="rp-done">
      <div><b data-count="${added}">${added}</b><span>${esc(t('added'))}</span></div>
      <div><b data-count="${updated}">${updated}</b><span>${esc(t('updated'))}</span></div>
      ${mode === 'replace' ? `<div><b data-count="${removed}">${removed}</b><span>${esc(t('removed'))}</span></div>` : ''}</div>`);
  countUp($overlay);
  if (location.hash === '#backup') drawBackupCard();
}
// Success sheet with a check mark

// ---------- Date card (registration date) ----------
const WEEKDAYS = { en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], so: ['Axad', 'Isniin', 'Talaado', 'Arbaco', 'Khamiis', 'Jimco', 'Sabti'], zh: ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'] };
function ago(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return t('just now');
  if (s < 3600) return t('{n} min ago', { n: Math.round(s / 60) });
  if (s < 86400) return t('{n} h ago', { n: Math.round(s / 3600) });
  const d = Math.round(s / 86400);
  if (d < 31) return t(d === 1 ? '{n} day ago' : '{n} days ago', { n: d });
  const m = Math.round(d / 30.4);
  if (m < 12) return t(m === 1 ? '{n} month ago' : '{n} months ago', { n: m });
  const y = Math.round(d / 365);
  return t(y === 1 ? '{n} year ago' : '{n} years ago', { n: y });
}
// big = add/detail card, otherwise a compact chip for lists
function dateCard(ts, note) {
  const d = new Date(ts || Date.now()), L = TradeI18n.getLang(), pad = n => (n < 10 ? '0' : '') + n;
  const month = TradeReport.monthShort(d.getMonth());
  return `<div class="datecard">
    <div class="dc-cal"><div class="dc-mon">${esc(month)}</div><div class="dc-day">${d.getDate()}</div><div class="dc-year">${d.getFullYear()}</div></div>
    <div class="dc-main">
      <div class="dc-k">${ic('calendar', B(), 13)}${esc(t('Date registered'))}</div>
      <div class="dc-date">${esc(WEEKDAYS[L][d.getDay()])}, ${esc(TradeReport.dateLabel(d.getTime()))}</div>
      <div class="dc-meta"><span class="dc-time">${ic('clock', '#64748B', 12)}${pad(d.getHours())}:${pad(d.getMinutes())}</span><span class="dc-ago">${esc(ts ? ago(ts) : t('Today'))}</span></div>
      ${note ? `<div class="dc-note">${esc(note)}</div>` : ''}
    </div>
  </div>`;
}

// Switch a photo between the cropped version and the original
function swapCrop(i) {
  const src = form.images[i];
  if (cropUndo.has(src)) { const o = cropUndo.get(src); cropRedo.set(o, src); cropUndo.delete(src); form.images[i] = o; }
  else if (cropRedo.has(src)) { const c = cropRedo.get(src); cropUndo.set(c, src); cropRedo.delete(src); form.images[i] = c; }
  drawImages();
}
// ---------- Crop editor: fix any photo by hand — drag the frame, pick a shape, rotate, or let Auto find the product ----------
const cropMeta = new Map(); // cropped src → { box, rot } (this session), so the editor reopens where you left it
const RATIOS = [['free', 'Free', 0], ['1:1', '1:1', 1], ['4:5', '4:5', 4 / 5], ['3:4', '3:4', 3 / 4], ['4:3', '4:3', 4 / 3], ['16:9', '16:9', 16 / 9]];
function rotated(img, rot) {
  const c = document.createElement('canvas'), q = rot % 180 !== 0;
  c.width = q ? img.height : img.width; c.height = q ? img.width : img.height;
  const x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -img.width / 2, -img.height / 2);
  return c;
}
async function cropEditor(i) {
  const cur = form.images[i]; if (!cur) return;
  const orig = cropUndo.get(cur) || cur;
  const img = await loadImg(orig).catch(() => null); if (!img) return toast(t('Could not read one photo'));
  const meta = cropMeta.get(cur);
  let rot = meta ? meta.rot : 0, src = rot ? rotated(img, rot) : img, ratio = 0, view = null;
  let box = meta ? Object.assign({}, meta.box) : { x: 0, y: 0, w: src.width, h: src.height };
  $overlay.innerHTML = `<div class="ce">
    <div class="ce-top"><span class="sc-x" id="ceX">${ic('x', '#fff', 20, 2.6)}</span><b>${esc(t('Crop photo'))}</b><span class="ce-done" id="ceOk">${ic('check', '#fff', 18, 3)}${esc(t('Done'))}</span></div>
    <div class="ce-stage" id="ceStage"><canvas id="ceImg"></canvas>
      <div class="ce-box" id="ceBox"><div class="ce-grid"><i></i><i></i><i></i><i></i></div>
        ${['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(h => `<span class="ce-h ${h}" data-h="${h}"></span>`).join('')}
        <div class="ce-laser" id="ceLaser"></div></div>
      <div class="ce-size" id="ceSize"></div></div>
    <div class="ce-bottom">
      <div class="ce-ratios" id="ceRatios">${RATIOS.map(r => `<span class="ce-r ${r[2] === ratio ? 'on' : ''}" data-r="${r[0]}"><i style="${r[2] ? `width:${Math.round(16 * Math.min(1, r[2]))}px;height:${Math.round(16 * Math.min(1, 1 / r[2]))}px` : ''}" class="${r[2] ? '' : 'free'}"></i>${esc(t(r[1]))}</span>`).join('')}</div>
      <div class="ce-tools">
        <span class="ce-t" id="ceAuto"><b>${ic('wand', '#fff', 20, 2.2)}</b>${esc(t('Auto'))}</span>
        <span class="ce-t" id="ceRot"><b>${ic('rotate', '#fff', 20, 2.2)}</b>${esc(t('Rotate'))}</span>
        <span class="ce-t" id="ceFull"><b>${ic('image', '#fff', 20, 2.2)}</b>${esc(t('Original'))}</span>
      </div>
    </div></div>`;
  const $st = document.getElementById('ceStage'), $cv = document.getElementById('ceImg'), $box = document.getElementById('ceBox');
  // fit the photo in the stage
  const layout = () => {
    const W = $st.clientWidth - 32, H = $st.clientHeight - 32, s = Math.min(W / src.width, H / src.height);
    view = { s, x: ($st.clientWidth - src.width * s) / 2, y: ($st.clientHeight - src.height * s) / 2 };
    $cv.width = Math.round(src.width * s * devicePixelRatio); $cv.height = Math.round(src.height * s * devicePixelRatio);
    Object.assign($cv.style, { left: view.x + 'px', top: view.y + 'px', width: src.width * s + 'px', height: src.height * s + 'px' });
    $cv.getContext('2d').drawImage(src, 0, 0, $cv.width, $cv.height);
    paint();
  };
  const paint = () => {
    Object.assign($box.style, { left: view.x + box.x * view.s + 'px', top: view.y + box.y * view.s + 'px', width: box.w * view.s + 'px', height: box.h * view.s + 'px' });
    document.getElementById('ceSize').textContent = Math.round(box.w) + ' × ' + Math.round(box.h);
  };
  const clamp = () => {
    const minS = Math.min(40, src.width, src.height);
    box.w = Math.max(minS, Math.min(box.w, src.width)); box.h = Math.max(minS, Math.min(box.h, src.height));
    box.x = Math.max(0, Math.min(box.x, src.width - box.w)); box.y = Math.max(0, Math.min(box.y, src.height - box.h));
  };
  // keep the shape: largest box of that ratio around the current centre
  const applyRatio = () => {
    if (!ratio) return;
    const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    let w = box.w, h = w / ratio;
    if (h > box.h) { h = box.h; w = h * ratio; }
    if (w < box.w * 0.7 && box.h * ratio <= src.width) { h = box.h; w = h * ratio; }
    if (w > src.width) { w = src.width; h = w / ratio; } if (h > src.height) { h = src.height; w = h * ratio; }
    Object.assign(box, { w, h, x: cx - w / 2, y: cy - h / 2 }); clamp();
  };
  // drag a corner, an edge, or the whole frame
  let drag = null;
  $box.onpointerdown = e => {
    e.preventDefault();
    drag = { h: e.target.dataset.h || 'move', x: e.clientX, y: e.clientY, b: Object.assign({}, box) };
    $box.setPointerCapture(e.pointerId); $box.classList.add('drag');
  };
  $box.onpointermove = e => {
    if (!drag) return;
    const dx = (e.clientX - drag.x) / view.s, dy = (e.clientY - drag.y) / view.s, b = drag.b, h = drag.h;
    if (h === 'move') { box.x = b.x + dx; box.y = b.y + dy; clamp(); return paint(); }
    let x0 = b.x, y0 = b.y, x1 = b.x + b.w, y1 = b.y + b.h;
    if (h.includes('w')) x0 = Math.min(x1 - 40, Math.max(0, b.x + dx));
    if (h.includes('e')) x1 = Math.max(x0 + 40, Math.min(src.width, x1 + dx));
    if (h.includes('n')) y0 = Math.min(y1 - 40, Math.max(0, b.y + dy));
    if (h.includes('s')) y1 = Math.max(y0 + 40, Math.min(src.height, y1 + dy));
    if (ratio) {
      // the dragged side leads, the other side follows the shape (anchored on the opposite side)
      let w = x1 - x0, hh = y1 - y0;
      if (h === 'n' || h === 's') w = hh * ratio; else hh = w / ratio;
      if (h.includes('w')) x0 = x1 - w; else if (h === 'n' || h === 's') { const c = b.x + b.w / 2; x0 = c - w / 2; } else x1 = x0 + w;
      if (h.includes('n')) y0 = y1 - hh; else if (h === 'e' || h === 'w') { const c = b.y + b.h / 2; y0 = c - hh / 2; } else y1 = y0 + hh;
      if (x0 < 0 || y0 < 0 || x0 + w > src.width + .5 || y0 + hh > src.height + .5) return; // would leave the photo
      Object.assign(box, { x: x0, y: y0, w, h: hh });
    } else Object.assign(box, { x: x0, y: y0, w: x1 - x0, h: y1 - y0 });
    paint();
  };
  $box.onpointerup = $box.onpointercancel = () => { drag = null; $box.classList.remove('drag'); };
  // tools
  document.getElementById('ceRatios').onclick = e => {
    const el = e.target.closest('.ce-r'); if (!el) return;
    ratio = (RATIOS.find(r => r[0] === el.dataset.r) || RATIOS[0])[2];
    $overlay.querySelectorAll('.ce-r').forEach(r => r.classList.toggle('on', r === el));
    applyRatio(); paint();
  };
  const auto = async () => {
    const L = document.getElementById('ceLaser'); L.classList.add('on'); $box.classList.add('finding');
    let b = null;
    try { b = await productBox(src); } catch (e) {}
    L.classList.remove('on'); $box.classList.remove('finding');
    if (!b) { box = { x: 0, y: 0, w: src.width, h: src.height }; toast(t('The product already fills the photo')); }
    else { box = { x: b.x, y: b.y, w: b.w, h: b.h }; clamp(); applyRatio(); }
    $box.classList.add('snap'); setTimeout(() => $box.classList.remove('snap'), 450);
    paint();
  };
  document.getElementById('ceAuto').onclick = auto;
  document.getElementById('ceRot').onclick = () => {
    rot = (rot + 90) % 360; src = rot ? rotated(img, rot) : img;
    // turn the frame with the photo
    const H0 = rot % 180 !== 0 ? img.height : img.width; // previous height (of the photo before this turn)

function drawBox(img, box, max, q) {
  box = box || { x: 0, y: 0, w: img.width, h: img.height };
  const s = Math.min(1, (max || 1000) / Math.max(box.w, box.h));
  const c = document.createElement('canvas'); c.width = Math.round(box.w * s); c.height = Math.round(box.h * s);
  c.getContext('2d').drawImage(img, box.x, box.y, box.w, box.h, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q || 0.78);
}
// Crop any photo (file or data URL) → { src, cropped, original }
async function cropPhoto(source, max, q) {
  const url = typeof source === 'string' ? source : URL.createObjectURL(source);
  try {
    const img = await loadImg(url), box = await productBox(img);
    return { src: drawBox(img, box, max, q), cropped: !!box, original: box ? drawBox(img, null, max, q) : null };
  } finally { if (url !== source) URL.revokeObjectURL(url); }
}
async function compress(file, max, q, crop) {
  if (crop) return cropPhoto(file, max, q);
  const url = URL.createObjectURL(file);
  try { return drawBox(await loadImg(url), null, max, q); } finally { URL.revokeObjectURL(url); }
}
// Originals of auto-cropped photos (cropped src → original data URL); saved with the product so "Original" always works
const cropUndo = new Map(), cropRedo = new Map(); // cropped → original, original → cropped
let photoBusy = 0, busyPreviews = [];
// Saved with the product: the original of every photo that is shown cropped ('' when not cropped)
const originalsOf = images => images.map(s => cropUndo.get(s) || '');
function loadCropPairs(p) {
  cropUndo.clear(); cropRedo.clear();
  if (p && p.origImages) p.images.forEach((s, i) => { if (p.origImages[i]) cropUndo.set(s, p.origImages[i]); });
}
// Crop the photos of products saved before auto-crop existed. Originals are kept, so "Original" undoes it per photo.
async function cropExisting() {
  const todo = DB.products.filter(p => (p.images || []).length);
  if (!todo.length) return toast(t('No photo needed cropping'));
  $overlay.innerHTML = `<div class="mask"><div class="busy"><div class="spinner"></div>
    <div class="busy-title">${esc(t('Finding the product in each photo…'))}</div>
    <div class="bar big"><div class="fill" id="prog" style="width:0%"></div></div><div class="hint" id="progt">0 / ${todo.length}</div></div></div>`;
  let n = 0, done = 0;
  for (const p of todo) {
    const images = p.images.slice(), orig = (p.origImages || []).slice();
    let changed = false;
    for (let i = 0; i < images.length; i++) {
      // always start again from the original, so a better crop replaces an older one
      try { const src = orig[i] || images[i], r = await cropPhoto(src, 1000, 0.82); if (r.cropped) { orig[i] = src; images[i] = r.src; changed = true; n++; } } catch (e) {}
    }
    if (changed) {
      const next = Object.assign({}, p, { images, origImages: images.map((s, i) => orig[i] || ''), hashes: await hashImages(images) });
      await store.upsert(next);
    }
    done++;
    const f = document.getElementById('prog'), tx = document.getElementById('progt');
    if (f) f.style.width = Math.round(done / todo.length * 100) + '%'; if (tx) tx.textContent = done + ' / ' + todo.length;
  }
  closeOverlay();
  toast(n ? t('{n} photos cropped ✓', { n }) : t('No photo needed cropping'));
}
async function onFiles(e) {
  const files = Array.from(e.target.files).slice(0, MAX_IMAGES - form.images.length);
  const sharp = [], first = form.images.length;
  let cropped = 0;
  photoBusy = files.length;
  busyPreviews = DB.kv.noCrop ? [] : files.map(f => URL.createObjectURL(f)); // the photo shows while it is being scanned
  drawImages();
  for (const f of files) {
    try {
      if (DB.kv.noCrop) form.images.push(await compress(f));
      else {
        const r = await compress(f, 1000, 0.8, true);
        form.images.push(r.src);
        if (r.cropped) { cropped++; cropUndo.set(r.src, r.original); justCropped = r.src; }
      }
      if (Scanner.pending) sharp.push(await compress(f, 1600, 0.88)); // sharper copy so the AI can read small label text
    } catch (err) { toast('Could not read one photo'); }
    photoBusy = Math.max(0, photoBusy - 1);
    const u = busyPreviews.shift(); if (u) setTimeout(() => URL.revokeObjectURL(u), 1000);
    drawImages();
  }
  photoBusy = 0; busyPreviews = []; e.target.value = ''; drawImages();
  setTimeout(() => { justCropped = ''; }, 1500);
  if (cropped) toast(t('Photo cropped to the product'));
  if (!Scanner.pending && form.images[first]) AutoFill.run(form.images[first]);
  if (Scanner.pending) { Scanner.pending = false; if (sharp.length) Scanner.analyse(sharp.concat(form.images.slice(0, form.images.length - files.length))); }
}

// ---------- AI scanner: camera → photo → Claude reads name, size, description ----------
const Scanner = {
  stream: null, pending: false, st: null,
  async status() {
    let st;
    try { const r = await fetch('api/ai/status', { cache: 'no-store' }); st = r.ok ? await r.json() : { configured: false, offline: true }; }
    catch (e) { st = { configured: false, offline: true }; }
    return this.st = st;
  },
  // Opens the phone camera app (file input). Must run inside the tap, so it never waits for the network first.
  pickPhoto(album) { this.pending = true; document.getElementById(album ? 'fileAlbum' : 'fileCamera').click(); },
  async open() {
    // Status is fetched when the Add page opens; use it right away so the camera still opens on iPhone/Android
    const st = this.st || await this.status();
    this.status(); // refresh for next time
    if (!st.configured) return this.notReady(st);
    // (after pairing the camera must be opened by a new tap, phones block it otherwise)
    if (!Sync.key()) return this.needPair(() => toast(t('Connected ✓ — tap Scan again')));
    const live = window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    if (!live) return this.pickPhoto(); // phone camera app (http on the Wi-Fi address)
    $overlay.innerHTML = `<div class="scanner">
      <video id="scVideo" autoplay playsinline muted></video>
      <div class="sc-top"><span class="sc-x" id="scClose">${ic('x', '#fff', 20, 2.6)}</span><span>${esc(t('Scan product with AI'))}</span><span style="width:36px"></span></div>
      <div class="sc-frame"><i class="k1"></i><i class="k2"></i><i class="k3"></i><i class="k4"></i><div class="sc-laser"></div></div>
      <div class="sc-hint">${esc(t('Fit the product and its label inside the frame'))}</div>
      <div class="sc-bar"><span class="sc-side" id="scGallery">${ic('image', '#fff', 22)}</span><span class="sc-shot" id="scShot"><i></i></span><span class="sc-side" id="scFlip">${ic('refresh', '#fff', 22)}</span></div>
    </div>`;
    let facing = 'environment';
    // Buttons work at once (gallery / close), even while the camera is still starting
    document.getElementById('scClose').onclick = () => this.close();
    document.getElementById('scGallery').onclick = () => { this.close(); this.pickPhoto(true); };
    const start = async () => {
      this.stop();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
        const v = document.getElementById('scVideo');
        if (!v) { stream.getTracks().forEach(tr => tr.stop()); return false; } // closed meanwhile
        this.stream = stream; v.srcObject = stream;
        return true;
      } catch (e) {
        // No camera / permission refused: keep the gallery button, explain
        const h = document.querySelector('.sc-hint');
        if (h) h.innerHTML = `<b>${esc(t('Could not open the camera'))}</b><br>${esc(e.name === 'NotAllowedError' ? 'Allow the camera for this site, or pick a photo from the gallery.' : 'Pick a photo from the gallery instead.')}`;
        return false;
      }
    };
    document.getElementById('scFlip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; start(); };
    await start();
    if (!document.getElementById('scShot')) return;
    document.getElementById('scShot').onclick = () => {
      const v = document.getElementById('scVideo');
      if (!v || !v.videoWidth) return toast(t('Could not open the camera'));
      const s = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
      c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      const shot = c.toDataURL('image/jpeg', 0.88);
      this.close();
      if (form.images.length < MAX_IMAGES) { form.images.unshift(shot); drawImages(); }
      this.analyse([shot].concat(form.images.filter(x => x !== shot)));
    };
  },
  stop() { if (this.stream) { this.stream.getTracks().forEach(tr => tr.stop()); this.stream = null; } },
  close() { this.stop(); closeOverlay(); },
  async notReady(st) {
    const v = await dialog({
      title: t('AI scanner is not set up'),
      text: st.offline ? t('The scanner works when the app is opened from the Trade computer (same Wi-Fi). Open the app from the computer’s address and try again.')
        : st.canConfigure ? t('The scanner needs a Claude API key. Add it in Settings → AI scanner on this computer.')
        : t('Add a Claude API key on the computer: Settings → AI scanner. Then every paired phone can scan.'),
      ok: st.canConfigure ? t('Open settings') : t('OK'), cancel: st.canConfigure ? t('Cancel') : false
    });
    if (v && st.canConfigure) location.hash = 'settings';
  },
  // The computer only scans for phones paired with it: ask for the pairing code here
  async needPair(then) {
    if (await connectDialog() && then) then();
  },
  // Resize for the AI (sharp enough to read small label text)
  prep(src) {
    return loadImg(src).then(img => {
      const s = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return { data: c.toDataURL('image/jpeg', 0.86).split(',')[1], mediaType: 'image/jpeg' };
    });
  },
  async analyse(images) {
    images = (images || []).filter(Boolean).slice(0, 6);
    if (!images.length) return toast(t('Add a photo first'));
    const st = await this.status();
    if (!st.configured) return this.notReady(st);
    if (!Sync.key()) return this.needPair(() => this.analyse(images));
    const steps = [t('Looking at the product…'), t('Reading labels and sizes…')];
    $overlay.innerHTML = `<div class="mask"><div class="scanning">
      <div class="sg-photo"><img src="${images[0]}"><div class="sc-laser"></div><i class="k1"></i><i class="k2"></i><i class="k3"></i><i class="k4"></i></div>
      <div class="sg-step" id="sgStep">${esc(steps[0])}</div><div class="hint">${esc(t('{n} photos', { n: images.length }))} · AI</div></div></div>`;
    let k = 0; const tick = setInterval(() => { const el = document.getElementById('sgStep'); if (el) el.textContent = steps[Math.min(++k, steps.length - 1)]; }, 2600);
    try {
      const payload = { images: await Promise.all(images.map(s => this.prep(s))), lang: TradeI18n.getLang() };
      const r = await fetch('api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-trade-key': Sync.key() }, body: JSON.stringify(payload) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 403) { clearInterval(tick); closeOverlay(); await DB.setKV('syncKey', ''); return this.needPair(() => this.analyse(images)); }
      if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
      clearInterval(tick);

    } catch (e) {
      clearInterval(tick); closeOverlay();

    }
  },
  result(r) {
    const conf = Math.round(Math.max(0, Math.min(1, Number(r.confidence) || 0)) * 100);
    const rows = [
      ['name', t('Product name'), r.name, true],
      ['size', t('Size'), r.size ? r.size + (r.size_source === 'estimate' ? ' (' + t('estimate') + ')' : '') : '', !!r.size],
      ['unit', t('Unit'), t(r.unit || 'pcs'), !!r.unit],
      ['price', t('Price'), r.price != null && r.currency ? r.currency + r.price : '', r.price != null && !!r.currency]
    ].filter(x => x[2]);
    $overlay.innerHTML = `<div class="mask bottom" id="srm"><div class="sheet scan-res" onclick="event.stopPropagation()">
      <div class="grip"></div>
      <div class="sr-head"><div class="ok" style="margin:0;width:44px;height:44px">${ic('scan', '#fff', 20, 2.4)}</div>
        <div style="flex:1;min-width:0;text-align:left"><div class="sheet-title" style="margin:0">${esc(t('Product recognised'))}</div>
        <div class="conf"><div class="conf-bar"><i style="width:${conf}%"></i></div><span>${esc(t('{n}% sure', { n: conf }))}</span></div></div></div>
      ${(r.colors || []).length || r.material ? `<div class="chips" style="justify-content:flex-start;margin:10px 0 2px">${(r.colors || []).map(c => `<span class="chip">${esc(c)}</span>`).join('')}${r.material ? `<span class="chip teal">${esc(r.material)}</span>` : ''}</div>` : ''}
      <div class="sr-rows">${rows.map(x => `<label class="sr-row"><input type="checkbox" data-k="${x[0]}" ${x[3] ? 'checked' : ''}><div style="min-width:0;flex:1"><div class="k">${esc(x[1])}</div><div class="v" data-notr>${esc(x[2]).replace(/\n/g, '<br>')}</div></div></label>`).join('')}</div>
      ${r.label_text ? `<div class="sr-label"><div class="k">${esc(t('Text on the label'))}</div><div data-notr>${esc(r.label_text)}</div></div>` : ''}
      <div class="sheet-actions"><button class="btn" id="srNo">${esc(t('Cancel'))}</button><button class="btn primary" id="srOk">${ic('check', '#fff', 17, 2.8)}${esc(t('Fill in'))}</button></div>
    </div></div>`;
    document.getElementById('srm').onclick = closeOverlay;
    document.getElementById('srNo').onclick = closeOverlay;
    document.getElementById('srOk').onclick = () => {
      const on = k => { const c = $overlay.querySelector(`input[data-k="${k}"]`); return c && c.checked; };

  el.innerHTML = list.map(w => `<div class="wcard ${w.done ? 'done' : ''}" data-wid="${w.id}">
      <span class="wl-check" data-tick="${w.id}">${w.done ? ic('check', '#fff', 14, 3.2) : ''}</span>
      ${w.image ? `<img class="wl-img" src="${w.image}" loading="lazy">` : `<div class="wl-img ph" style="--h:${hueOf(w.title)}">${esc((w.title || '?').trim().charAt(0).toUpperCase())}</div>`}
      <div class="wl-body">
        <div class="wl-title" data-notr>${esc(w.title)}</div>
        ${w.note ? `<div class="wl-note" data-notr>${esc(w.note)}</div>` : ''}
        <div class="wl-meta"><span class="wl-hearts">${hearts(w.priority)}</span>
          ${Number(w.price) > 0 ? `<span class="chip teal">${esc(w.currency || '¥')}${esc(TradeReport.money(Number(w.price)))}</span>` : ''}
          ${w.link ? `<span class="chip">${ic('link', '#64748B', 11, 2.4)}${esc(t('Link'))}</span>` : ''}
          <span class="wl-ago">${esc(ago(w.createdAt || w.updatedAt || Date.now()))}</span></div>
      </div></div>`).join('');
  stagger(el);
  el.querySelectorAll('.wcard').forEach(c => c.onclick = e => {
    if (e.target.closest('[data-tick]')) return;
    editWish(c.dataset.wid);
  });
  el.querySelectorAll('[data-tick]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const w = wishes.get(b.dataset.tick); if (!w) return;
    const card = b.closest('.wcard'); card.classList.add(w.done ? 'untick' : 'tick');
    await wishes.save(Object.assign({}, w, { done: !w.done, doneAt: w.done ? 0 : Date.now() }));
    if (!w.done) toast(t('Nice — you got it ✓'));
    setTimeout(() => renderWishlist(), 420);
  });
}
// Full editor: title, note, photo, price, how much you want it, link — then save or delete
function editWish(id) {
  const old = id ? wishes.get(id) : null;
  const w = Object.assign({ title: '', note: '', price: '', currency: '¥', priority: 2, image: '', link: '', done: false }, old ? JSON.parse(JSON.stringify(old)) : {});
  const draw = () => {
    $overlay.innerHTML = `<div class="mask bottom" id="wem"><div class="sheet we" onclick="event.stopPropagation()"><div class="grip"></div>
      <div class="we-top">
        <div class="we-photo tap" id="wePhoto">${w.image ? `<img src="${w.image}">` : `${ic('camera', B(), 24)}<span>${esc(t('Photo'))}</span>`}</div>
        <div style="flex:1;min-width:0">
          <div class="field" style="margin-bottom:8px"><div class="label">${esc(t('What do you like?'))} <span class="req">*</span></div><input class="input" id="weTitle" value="${esc(w.title)}" maxlength="120"></div>
          <div class="we-pri"><span>${esc(t('How much?'))}</span>${[1, 2, 3].map(i => `<i data-p="${i}" class="${i <= w.priority ? 'on' : ''}">${ic('heart', i <= w.priority ? '#F43F5E' : '#CBD5E1', 20, 2.4)}</i>`).join('')}</div>
        </div>
      </div>
      <div class="field"><div class="label">${esc(t('Note'))}</div><textarea class="input textarea" id="weNote" rows="2" maxlength="800">${esc(w.note)}</textarea></div>
      <div class="we-row">
        <div class="field" style="flex:1"><div class="label">${esc(t('Price'))}</div>
          <div class="joined"><select class="addon" id="weCur">${CURRENCIES.map(c => `<option ${c === w.currency ? 'selected' : ''}>${c}</option>`).join('')}</select><input class="input" id="wePrice" inputmode="decimal" value="${esc(w.price)}"></div></div>
      </div>
      <div class="field"><div class="label">${esc(t('Link or where you saw it'))}</div><input class="input" id="weLink" value="${esc(w.link)}" autocapitalize="off"></div>
      ${old ? `<div class="we-acts">
        <button class="btn sm soft" id="weProd">${ic('box', B(), 15)}${esc(t('Save as a product'))}</button>
        <button class="btn sm danger" id="weDel" style="width:44px;flex-shrink:0">${ic('trash', '#E11D48', 16)}</button></div>` : ''}
      <div class="sheet-actions"><button class="btn" id="weNo">${esc(t('Cancel'))}</button><button class="btn primary" id="weOk">${ic('heart', '#fff', 16, 2.6)}${esc(t('Save'))}</button></div>
      <input type="file" id="weFile" accept="image/*" hidden>
    </div></div>`;
    const keep = () => { w.title = document.getElementById('weTitle').value; w.note = document.getElementById('weNote').value; w.price = document.getElementById('wePrice').value; w.currency = document.getElementById('weCur').value; w.link = document.getElementById('weLink').value; };
    document.getElementById('wem').onclick = closeOverlay;
    document.getElementById('weNo').onclick = closeOverlay;
    $overlay.querySelectorAll('.we-pri i').forEach(h => h.onclick = () => { keep(); w.priority = Number(h.dataset.p); draw(); });
    document.getElementById('wePhoto').onclick = () => { keep(); document.getElementById('weFile').click(); };
    document.getElementById('weFile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      const ph = document.getElementById('wePhoto'); ph.innerHTML = '<div class="spinner" style="width:24px;height:24px;border-width:3px"></div>';
      try { const r = DB.kv.noCrop ? await compress(f, 900, 0.8) : (await compress(f, 900, 0.8, true)).src; w.image = r; } catch (err) { toast(t('Could not read one photo')); }
      draw();
    };
    document.getElementById('weOk').onclick = async () => {
      keep();
      const title = norm(w.title);
      if (!title) return toast(t('Write what you like first'));
      const rec = Object.assign({}, old || {}, w, { id: old ? old.id : 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, note: String(w.note || '').trim(), link: String(w.link || '').trim(),
        price: Number(w.price) > 0 ? String(Number(w.price)) : '', createdAt: old ? old.createdAt : Date.now() });
      await wishes.save(rec); closeOverlay(); toast(t('Saved ✓')); renderWishlist();
    };
    const del = document.getElementById('weDel'); if (del) del.onclick = async () => {
      if (!await dialog({ title: t('Remove from wishlist?'), text: `"${old.title}"`, ok: t('Remove'), danger: true })) return;
      await wishes.remove(old.id); toast(t('Removed')); renderWishlist();
    };
    const pr = document.getElementById('weProd'); if (pr) pr.onclick = () => { keep(); wishToProduct = Object.assign({}, w); closeOverlay(); location.hash = 'add'; };
  };
  draw();
}
let wishToProduct = null; // a wish opened as a new product: fills the Add form once

// ---------- pages/detail ----------
function renderDetail(id) {
  const p = store.get(id);
  simpleNav(''); tabbar(null);
  if (!p) { $body.innerHTML = `<div class="floatback" onclick="history.back()">${ic('left', '#0F172A', 18, 2.6)}</div><div class="page muted" style="padding-top:120px;text-align:center">Product not found.</div>`; return; }
  const moq = priceParts(p.price * p.minOrder);
  const row = (icon, k, v, extra, first) => `<div class="row ${first ? 'first' : ''}"><div class="row-icon">${ic(icon, '#64748B', 17)}</div><div style="flex:1;min-width:0"><div class="k">${k}</div>${v}${extra || ''}</div></div>`;
  // Same product in other shops
  const same = TradeSimilar.groups(store.all(), 'both').find(g => g.products.includes(p));
  $body.innerHTML = `
    <div class="floatback" onclick="history.back()">${ic('left', '#0F172A', 18, 2.6)}</div>
    <div class="gallery">
      ${p.images.length ? `<div class="swiper" id="sw">${p.images.map(s => `<img src="${s}">`).join('')}</div>` : `<div class="swiper" style="flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-3);font-size:13px">${ic('image', '#B6C0CD', 48, 1.4)}No photo</div>`}
      ${p.images.length > 1 ? `<div class="counter" id="ctr">1 / ${p.images.length}</div>` : ''}
    </div>
    <div class="page d-sheet">
      <div class="card" style="padding-top:18px">
        <div class="d-name" data-notr>${esc(p.name)}</div>
        ${priceHtml(p.currency, p.price, p.unit, 'd-price')}
        <div class="specs">
          <div class="spec"><div class="icon-tile">${ic('ruler', B(), 16)}</div><div style="min-width:0"><div class="k">Size</div><div class="v">${esc(p.size || '—')}</div></div></div>
          <div class="spec"><div class="icon-tile">${ic('box', B(), 16)}</div><div style="min-width:0"><div class="k">Minimum order</div><div class="v">${esc(p.minOrder)} ${esc(t(p.unit))}</div></div></div>
        </div>
        <div class="moq"><span>Value at minimum order</span><span class="moq-v">${esc(p.currency)}${moq.int}.${moq.dec}</span></div>
      </div>
      ${dateCard(TradeReport.registeredAt(p))}
      <div class="card" style="margin-top:12px">
        <div class="card-head"><div class="card-title"><div class="icon-tile">${ic('store', B(), 16)}</div>Where to buy</div></div>
        ${row('market', 'Market', `<div class="v ${p.marketName ? '' : 'none'}" data-notr>${esc(p.marketName || '')}</div>${p.marketName ? '' : `<div class="v none">${esc(t('Not set'))}</div>`}`, '', true)}
        ${row('store', 'Shop', `<div class="v" data-notr>${esc(p.shopName)}</div>`, p.shopNote ? `<div class="hint shopnote" data-notr>${esc(p.shopNote)}</div>` : '')}
        ${p.shopWechat ? row('wechat', 'WeChat', p.shopWechat === 'yes'
          ? `<div class="wx-row"><span class="v" data-notr>${esc(p.wechatId)}</span><button class="btn sm soft wx-copy" id="copyWx">${ic('copy', B(), 14)}${esc(t('Copy'))}</button></div><div class="hint">${esc(t('Shop is on WeChat'))}</div>`
          : `<div class="v none">${esc(t('No WeChat'))}</div>`) : ''}
        ${row('pin', 'Location', `<div class="v ${p.location ? '' : 'none'}">${esc(p.location ? p.location.name : 'Not set')}</div>`, p.location ? `<div class="hint">${esc(p.location.address)}</div>` : '')}
        ${p.location ? `
          <div class="map" id="dmap"></div>
          <div class="map-actions">
            <button class="btn soft" id="copyAmap">${ic('copy', B(), 16)}Copy link</button>
            <button class="btn primary" id="openAmap">${ic('nav', '#fff', 16)}Open in Amap</button>
          </div>` : ''}
      </div>
      ${same ? `<div class="card">
        <div class="card-head"><div class="card-title"><div class="icon-tile">${ic('similar', B(), 16)}</div>Same product elsewhere</div><span class="hint">${plural(same.products.length - 1, 'other')}</span></div>
        ${same.products.filter(x => x !== p).map(x => `<div class="mini" onclick="location.hash='detail/${x.id}'">
          ${thumbOf(x) ? `<img src="${thumbOf(x)}">` : `<div class="ph">${ic('image', '#B6C0CD', 18)}</div>`}
          <div style="flex:1;min-width:0"><div class="mini-name ellipsis" data-notr>${esc(x.name)}</div><div class="mini-sub ellipsis" data-notr>${esc(x.marketName ? x.marketName + ' · ' : '')}${esc(x.shopName)}</div></div>
          <div class="mini-price">${money(x.currency, x.price)}${x.currency === p.currency ? `<div class="mini-sub" style="color:${x.price < p.price ? '#16A34A' : x.price > p.price ? 'var(--price)' : 'var(--ink-3)'}">${x.price < p.price ? 'cheaper' : x.price > p.price ? 'dearer' : 'same price'}</div>` : ''}</div></div>`).join('')}
      </div>` : ''}
    </div>`;
  $tabbar.innerHTML = `<div class="bar-fixed">
    <button class="btn danger" style="width:48px;flex-shrink:0" id="del">${ic('trash', '#E11D48', 19)}</button>
    <button class="btn primary" style="flex:1" onclick="location.hash='add/${p.id}'">${ic('edit', '#fff', 17)}Edit product</button></div>`;
  const sw = document.getElementById('sw'), ctr = document.getElementById('ctr');
  if (sw && ctr) sw.onscroll = () => ctr.textContent = (Math.round(sw.scrollLeft / sw.clientWidth) + 1) + ' / ' + p.images.length;
  if (p.location && window.L) {
    const ll = [p.location.latitude, p.location.longitude];
    const m = L.map('dmap', { attributionControl: false, zoomControl: false, dragging: false, scrollWheelZoom: false }).setView(ll, 16);
    tileLayer().addTo(m); L.marker(ll).addTo(m);
    const open = () => window.open(amapUrl(p.location, p.shopName), '_blank');
    m.on('click', open);
    document.getElementById('openAmap').onclick = open;
    document.getElementById('copyAmap').onclick = () => {
      const url = amapUrl(p.location, p.shopName);
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('Link copied'), () => prompt('Copy the link:', url));
    };
  }
  const cw = document.getElementById('copyWx');
  if (cw) cw.onclick = () => (navigator.clipboard ? navigator.clipboard.writeText(p.wechatId) : Promise.reject()).then(() => toast(t('WeChat ID copied — paste it in WeChat → Add contacts')), () => prompt('WeChat', p.wechatId));
  document.getElementById('del').onclick = async () => {
    const b = document.getElementById('del'); if (b.disabled) return; b.disabled = true;
    // What flies into the Trash: the photo on screen (or the name card when there is no photo)
    const sw = document.getElementById('sw'), img = sw && sw.children[Math.round(sw.scrollLeft / (sw.clientWidth || 1))];
    const src = img ? document.querySelector('.gallery') : document.querySelector('.d-sheet .card');
    await store.remove(p.id);
    await genieToTrash(src, img && img.src);
    toast(t('Moved to Trash'));
    history.back();
  };
}

// ---------- start ----------
(async () => {
  await DB.init();
  if (!DB.kv.lang) { const nl = (navigator.language || 'en').toLowerCase(); await DB.setKV('lang', nl.startsWith('zh') ? 'zh' : nl.startsWith('so') ? 'so' : 'en'); }
  applyLang(DB.kv.lang);
  applyTheme(DB.kv.theme || 'jade');
  document.body.classList.toggle('noanim', !!DB.kv.noanim);
  await Folder.init();
  route();
  Sync.init();
  if (!await Persist.check()) Persist.ask();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(() => Install.show(), 1200);
})();
</script>
