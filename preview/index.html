    const items = [...$body.querySelectorAll('.tr-item')];
    items.forEach((el, i) => setTimeout(() => el.classList.add('out-x'), i * 60));
    await trash.empty();
    await wait(items.length * 60 + 420); renderTrash();
  };
}

// "Storage": says plainly where the database is kept, and offers the step that makes it permanent
async function drawPersist() {
  // Ask the browser to keep the data permanently (not cleared when space is low)
  const persisted = await Persist.check() || await Persist.ask();
  let used = '';
  try { const est = await navigator.storage.estimate(); used = t(' · {x} used', { x: est.usage > 1048576 ? (est.usage / 1048576).toFixed(1) + ' MB' : Math.round(est.usage / 1024) + ' KB' }); } catch (e) {}
  const el = document.getElementById('persist');
  if (!el) return;
  const onPc = !!Sync.key(), folder = Folder.handle && Folder.perm === 'granted', installed = Install.standalone();
  const good = onPc || persisted || folder || !!Cloud.cfg();
  const lines = [];
  if (Cloud.here()) lines.push(t('Main copy: this phone, saved to your private GitHub repository'));
  if (onPc) lines.push(t('Saved on this phone and on the computer — never lost{x}', { x: used }));
  else if (persisted) lines.push(t(installed ? 'Installed app · permanent database is on{x}' : 'Permanent storage is on{x}', { x: used }));
  else if (!window.isSecureContext) lines.push(t('This address (http) cannot keep data permanently on the phone{x}. Connect to the Trade computer so every product is kept forever.', { x: used }));
  else if (!installed) lines.push(t('Saved on this device{x}. Install the app to make storage permanent.', { x: used }));
  else lines.push(t('Saved on this device{x}. The browser has not made it permanent yet — tap the button below.', { x: used }));
  if (Folder.handle) lines.push(Folder.perm === 'granted'
    ? t('Also saved as a file in the folder “{x}”', { x: Folder.handle.name }) + (DB.kv.folderSaved ? ' · ' + TradeReport.dateTimeLabel(DB.kv.folderSaved) : '')
    : t('Folder “{x}” needs your OK again', { x: Folder.handle.name }));
  const btns = [];
  if (!onPc && Sync.server && !Sync.server.key) btns.push(`<button class="btn sm primary" id="pConn">${ic('devices', '#fff', 15)}${esc(t('Connect to the computer'))}</button>`);
  if (!persisted && window.isSecureContext && navigator.storage && navigator.storage.persist && installed) btns.push(`<button class="btn sm primary" id="pAsk">${ic('shield', '#fff', 15)}${esc(t('Make storage permanent'))}</button>`);
  if (!installed && Install.can()) btns.push(`<button class="btn sm primary" id="pInst">${ic('download', '#fff', 15)}${esc(t('Install app'))}</button>`);
  if (Folder.supported()) btns.push(Folder.handle && Folder.perm !== 'granted'
    ? `<button class="btn sm soft" id="pAllow">${ic('check', B(), 15)}${esc(t('Allow folder'))}</button>`
    : Folder.handle ? `<button class="btn sm" id="pOff">${esc(t('Stop saving to folder'))}</button>`
    : `<button class="btn sm soft" id="pFolder">${ic('download', B(), 15)}${esc(t('Auto-save to a folder'))}</button>`);
  el.className = 'status' + (good ? '' : ' warn');
  el.style.flexDirection = 'column'; el.style.alignItems = 'stretch';
  el.innerHTML = `<div style="display:flex;gap:10px;align-items:flex-start">${ic('shield', good ? B() : '#B45309', 18)}<div style="flex:1">${lines.map(esc).join('<div style="height:4px"></div>')}</div></div>
    ${btns.length ? `<div class="row-btns" style="margin-top:2px">${btns.join('')}</div>` : ''}`;
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('pConn', () => { location.hash = 'devices'; setTimeout(() => { const i = document.getElementById('pairCode'); if (i) i.focus(); }, 500); });
  on('pAsk', async () => { toast(await Persist.ask() ? t('Permanent storage is on ✓') : t('The browser said no — connect to the computer or auto-save to a folder')); drawPersist(); });
  on('pInst', () => Install.run());
  on('pFolder', async () => { if (await Folder.choose()) { toast(t('Saved to the folder ✓')); drawPersist(); } });
  on('pAllow', async () => { await Folder.allow(); drawPersist(); });
  on('pOff', async () => { await Folder.off(); drawPersist(); });
}

// ---------- QR scanner: a phone (iPhone, Android, any browser) pairs by scanning the computer's QR code ----------
// Android has a built-in detector (BarcodeDetector); iPhone Safari does not, so jsQR (utils/jsqr.js, kept offline) reads the camera frames.
const QrScan = {
  lib: null,
  load() {
    if (window.jsQR) return Promise.resolve();
    return this.lib || (this.lib = new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'utils/jsqr.js'; s.onload = ok; s.onerror = () => { this.lib = null; no(new Error(t('Could not open the camera'))); }; document.head.appendChild(s); }));
  },
  async native() {
    try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) return new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}
    return null;
  },
  // One picture (video frame or image) → the text in its QR code, or ''
  async read(src, w, h, det) {
    if (det) { try { const r = await det.detect(src); if (r[0] && r[0].rawValue) return r[0].rawValue; } catch (e) {} }
    if (!window.jsQR || !w || !h) return '';
    const s = Math.min(1, 800 / Math.max(w, h)), c = this.cv || (this.cv = document.createElement('canvas'));
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(src, 0, 0, c.width, c.height);
    const r = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    return r && r.data || '';
  },
  // A photo from the camera app or the gallery (used when the live camera is not available)
  photo(capture) {
    return new Promise(resolve => {
      const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (capture) i.capture = 'environment';
      i.onchange = async () => {
        const f = i.files && i.files[0]; if (!f) return resolve('');
        try {
          await this.load().catch(() => {});
          const url = URL.createObjectURL(f), img = await loadImg(url);
          const txt = await this.read(img, img.naturalWidth || img.width, img.naturalHeight || img.height, await this.native());
          URL.revokeObjectURL(url); resolve(txt);
        } catch (e) { resolve(''); }
      };
      i.click();
    });
  },
  // Live camera with a square frame; resolves with the QR text, or null when closed
  scan() {
    const live = window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    if (!live) return this.photo(true).then(x => x || (toast(t('No QR code found in the photo')), null));
    return new Promise(async resolve => {
      $overlay.innerHTML = `<div class="scanner">
        <video id="qrVideo" autoplay playsinline muted></video>
        <div class="sc-top"><span class="sc-x" id="qrClose">${ic('x', '#fff', 20, 2.6)}</span><span>${esc(t('Scan the QR code on the computer'))}</span><span style="width:36px"></span></div>
        <div class="sc-frame sq"><i class="k1"></i><i class="k2"></i><i class="k3"></i><i class="k4"></i><div class="sc-laser"></div></div>
        <div class="sc-hint" id="qrHint">${esc(t('On the computer open Trade → Settings → Use on another device, then point the camera at the QR code'))}</div>
        <div class="sc-bar"><span class="sc-side" id="qrGallery">${ic('image', '#fff', 22)}</span><span></span><span style="width:46px"></span></div>
      </div>`;
      let stream = null, done = false;
      const finish = v => { if (done) return; done = true; if (stream) stream.getTracks().forEach(tr => tr.stop()); closeOverlay(); resolve(v); };
      document.getElementById('qrClose').onclick = () => finish(null);
      document.getElementById('qrGallery').onclick = async () => { const x = await this.photo(false); if (x) finish(x); else toast(t('No QR code found in the photo')); };
      const det = await this.native();
      if (!det) this.load().catch(() => {});
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
        const v = document.getElementById('qrVideo');
        if (!v || done) { stream.getTracks().forEach(tr => tr.stop()); return; }
        v.srcObject = stream; if (v.play) v.play().catch(() => {});
        const tick = async () => {
          if (done) return;
          if (!document.getElementById('qrVideo')) return finish(null);
          if (v.readyState >= 2 && v.videoWidth) { const x = await this.read(v, v.videoWidth, v.videoHeight, det); if (x) { if (navigator.vibrate) navigator.vibrate(60); return finish(x); } }
          setTimeout(tick, 180);
        };
        tick();
      } catch (e) {
        const h = document.getElementById('qrHint');
        if (h) h.innerHTML = `<b>${esc(t('Could not open the camera'))}</b><br>${esc(t('Allow the camera for Trade, or pick a photo of the QR code from the gallery.'))}`;
      }
    });
  },
  // Scan, then connect with what the code holds: the pairing link (computer address + key), the key alone, or the 6 digits
  async pair() {
    const txt = String(await this.scan() || '').trim();
    if (!txt) return false;
    // The computer's QR code (one scan links this phone)
    const L = Sync.parseLink(txt);
    if (L) return Sync.linkQr(L);
    // Older Trade computers: the pairing link with the computer's key, or the key / 6 digits alone
    const m = /^\s*(\S+?)\/?#(?:.*&)?pair=([\w-]+)/.exec(txt);
    if (window.TradeApp) {
      // Android app: remember the computer's address from the link
      const link = TradeApp.parseLink(txt);
      if (link) TradeApp.setServer(link.server);
      else if (!/^\d{6}$|^[\w-]{8,}$/.test(txt)) throw new Error(t('This QR code is not from the Trade computer'));
      await Sync.connect(link ? link.key : txt);
      return true;
    }
    const key = m ? m[2] : /^\d{6}$|^[\w-]{8,}$/.test(txt) ? txt : '';
    if (!key) throw new Error(t('This QR code is not from the Trade computer'));
    try { await Sync.connect(key); return true; }
    catch (e) {
      // A browser tab opened from another address: open the computer's own link instead (it pairs by itself).
      // Not inside the installed iPhone app — leaving its address would start an empty app.
      let other = '';
      try { other = m && new URL(m[1].replace(/\/?$/, '/')).origin; } catch (x) {}
      if (other && other !== location.origin && !Install.standalone()) { location.href = txt; return false; }
      throw e;
    }
  }
};

// ---------- Permanent storage ----------
// 1. The browser is asked to never clear this app's database (granted for installed apps; on the first tap if a tap is needed).
// 2. Optional: a folder on this device where the whole database is saved as a real file after every change
//    (Trade-data.json + one copy per day). Survives clearing the browser and uninstalling the app.
const Folder = {
  handle: null, perm: '', timer: null, error: '',
  supported: () => !!window.showDirectoryPicker && !!DB.db,
  async init() {
    this.handle = DB.kv.folder && DB.kv.folder.getFileHandle ? DB.kv.folder : null;
    if (this.handle) try { this.perm = await this.handle.queryPermission({ mode: 'readwrite' }); } catch (e) { this.perm = 'denied'; }
  },
  async choose() {
    let h;
    try { h = await window.showDirectoryPicker({ id: 'trade-data', mode: 'readwrite', startIn: 'documents' }); } catch (e) { return false; }
    this.handle = h; this.perm = 'granted';
    await DB.setKV('folder', h);
    await this.save();
    return true;
  },
  async allow() {
    if (!this.handle) return false;
    try { this.perm = await this.handle.requestPermission({ mode: 'readwrite' }); } catch (e) { this.perm = 'denied'; }
    if (this.perm === 'granted') await this.save();
    return this.perm === 'granted';
  },
  schedule() { if (!this.handle) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.save(), 2500); },
  async save() {
    if (!this.handle || this.perm !== 'granted') return;
    try {
      const text = JSON.stringify(backupData());
      for (const name of ['Trade-data.json', 'Trade-' + TradeReport.ymd(Date.now()) + '.json']) {
        const f = await this.handle.getFileHandle(name, { create: true }), w = await f.createWritable();
        await w.write(text); await w.close(); // written to a temp file, swapped in on close
      }
      this.error = '';
      await DB.setKV('folderSaved', Date.now());
    } catch (e) { this.error = e.message || String(e); }
  },
  async off() { this.handle = null; this.perm = ''; delete DB.kv.folder; await DB.write('kv', 'delete', 'folder'); }
};
const Persist = {
  ok: false,
  async check() { try { this.ok = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); } catch (e) {} return this.ok; },
  async ask() { try { if (navigator.storage && navigator.storage.persist) this.ok = await navigator.storage.persist() || this.ok; } catch (e) {} return this.ok; }
};
// Some browsers only grant permanent storage (and folder access) after a tap — ask on the first one
document.addEventListener('pointerdown', function firstTap() {
  document.removeEventListener('pointerdown', firstTap, true);
  if (Folder.handle && Folder.perm === 'prompt') Folder.allow();
  if (!Persist.ok) Persist.ask();
}, true);

async function backup() {
  const data = backupData();
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const name = 'Trade-backup-' + TradeReport.ymd(Date.now()) + '.json';
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /android|iphone|ipad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) { if (e.name === 'AbortError') return; saveFile(blob, name); }
  } else saveFile(blob, name);
  await DB.setKV('lastBackup', Date.now());
  doneSheet(t('Backup saved ✓'), `<div class="file"><div class="ex-icon">${ic('shield', B(), 20)}</div><div style="flex:1;min-width:0"><div class="file-name ellipsis" data-notr>${esc(name)}</div><div class="hint">${fmtSize(blob.size)} · ${esc(plural(data.products.length, 'product'))} · ${esc(t('{n} photos', { n: photoCount(data.products) }))}</div></div></div>
    <div class="hint" style="margin-top:10px;line-height:1.5">${esc(t('Keep this file somewhere safe (Files, Google Drive, email to yourself). Restore it on any phone or computer.'))}</div>`);

}
async function restoreFile(e) {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { return toast(t('This is not a Trade backup file')); }
  restorePreview(data, f.name);
}
// What a backup would change on this device: new / changed / same
function restoreDiff(data) {
  const out = {};
  for (const k of SYNC_KINDS) {
    const list = Array.isArray(data[k]) ? data[k].filter(x => x && x.id) : [];
    let add = 0, upd = 0, same = 0;
    list.forEach(x => {
      const l = k === 'markets' ? DB.markets.find(m => m.id === x.id || m.name.toLowerCase() === norm(x.name).toLowerCase()) : DB[k].find(y => y.id === x.id);
      if (!l) add++;
      else if (k !== 'markets' && JSON.stringify(Object.assign({}, l, { updatedAt: 0 })) !== JSON.stringify(Object.assign({}, x, { updatedAt: 0, _rev: undefined }))) upd++;
      else same++;
    });
    const ids = new Set(list.map(x => x.id)), names = new Set(list.map(x => norm(x.name).toLowerCase()));
    // a kind the backup does not have (e.g. Trash in an older backup) is left as it is
    const extra = !Array.isArray(data[k]) ? 0 : DB[k].filter(x => !(ids.has(x.id) || (k === 'markets' && names.has(x.name.toLowerCase())))).length;
    out[k] = { list, add, upd, same, extra };
  }
  return out;
}
async function restorePreview(data, source) {
  if (!data || data.app !== 'trade' || !Array.isArray(data.products)) return toast(t('This is not a Trade backup file'));
  const diff = restoreDiff(data);
  let mode = 'merge';
  const row = (icon, k, d) => `<div class="rp-row"><div class="bk-sic">${ic(icon, B(), 15)}</div><div style="flex:1;min-width:0"><b>${esc(t(k))}</b><span>${d.list.length}</span></div>

  const paint = () => {
    const extra = SYNC_KINDS.reduce((n, k) => n + diff[k].extra, 0);
    $overlay.innerHTML = `<div class="mask bottom" id="rpm"><div class="sheet rp" onclick="event.stopPropagation()"><div class="grip"></div>
      <div class="rp-head"><div class="bk-orb sm">${ic('upload', '#fff', 20, 2.4)}</div><div style="flex:1;min-width:0;text-align:left">

        <div class="rp-mode ${mode === 'replace' ? 'on danger' : ''}" data-m="replace"><span class="rp-radio"></span><div><b>${esc(t('Make it exactly the backup'))}</b><span>${esc(extra ? t('{n} items that are not in the backup will be removed — also from the computer and other devices.', { n: extra }) : t('Every item is set back to the backup version.'))}</span></div></div>
      </div>
      <div class="sheet-actions"><button class="btn" id="rpNo">${esc(t('Cancel'))}</button><button class="btn ${mode === 'replace' ? 'danger' : 'primary'}" id="rpGo">${ic('check', mode === 'replace' ? '#E11D48' : '#fff', 17, 2.8)}${esc(t('Restore'))}</button></div>
    </div></div>`;
    document.getElementById('rpm').onclick = closeOverlay;
    document.getElementById('rpNo').onclick = closeOverlay;
    $overlay.querySelectorAll('.rp-mode').forEach(m => m.onclick = () => { mode = m.dataset.m; paint(); });
    document.getElementById('rpGo').onclick = () => applyRestore(diff, mode);
  };
  paint();
}
async function applyRestore(diff, mode) {
  const total = SYNC_KINDS.reduce((n, k) => n + diff[k].list.length + (mode === 'replace' ? diff[k].extra : 0), 0) || 1;
  $overlay.innerHTML = `<div class="mask"><div class="busy"><div class="bk-orb spin">${ic('refresh', '#fff', 22, 2.4)}</div>
    <div class="busy-title">${esc(t('Restoring…'))}</div>
    <div class="bar big"><div class="fill" id="prog" style="width:0%"></div></div><div class="hint" id="progt">0 / ${total}</div></div></div>`;
  let done = 0, added = 0, updated = 0, removed = 0;
  const tick = () => { done++; if (done % 3 && done !== total) return; const f = document.getElementById('prog'), x = document.getElementById('progt'); if (f) f.style.width = Math.round(done / total * 100) + '%'; if (x) x.textContent = done + ' / ' + total; };
  try {
    for (const k of SYNC_KINDS) {
      const { list } = diff[k];
      for (const raw of list) {
        const rec = Object.assign({}, raw); delete rec._rev;
        if (k === 'markets') {
          const ex = DB.markets.find(m => m.id === rec.id || m.name.toLowerCase() === norm(rec.name).toLowerCase());
          if (!ex) { DB.markets.push(rec); await DB.write('markets', 'put', rec); added++; }
          else if (mode === 'replace' && ex.id === rec.id && JSON.stringify(ex) !== JSON.stringify(rec)) { Object.assign(ex, rec); await DB.write('markets', 'put', ex); updated++; }
        } else {
          const i = DB[k].findIndex(x => x.id === rec.id), local = i >= 0 ? DB[k][i] : null;
          if (!local) { DB[k].push(rec); await DB.write(k, 'put', rec); added++; }
          else if (JSON.stringify(Object.assign({}, local, { updatedAt: 0 })) !== JSON.stringify(Object.assign({}, rec, { updatedAt: 0 }))
            && (mode === 'replace' || (Number(rec.updatedAt) || 0) >= (Number(local.updatedAt) || 0))) { DB[k][i] = rec; await DB.write(k, 'put', rec); updated++; }
        }
        tick();
      }
      if (mode === 'replace' && diff[k].extra) {
        const ids = new Set(list.map(x => x.id)), names = new Set(list.map(x => norm(x.name).toLowerCase()));
        for (const x of DB[k].filter(x => !(ids.has(x.id) || (k === 'markets' && names.has(x.name.toLowerCase()))))) {
          DB[k] = DB[k].filter(y => y !== x); await DB.write(k, 'delete', x.id); removed++; tick();
        }
      }
    }
  } catch (e) { closeOverlay(); return dialog({ title: t('Restore failed'), text: e.message, ok: t('OK'), cancel: false }); }
  Sync.soon(300);
  doneSheet(t('Restored ✓'), `<div class="rp-done">
      <div><b data-count="${added}">${added}</b><span>${esc(t('added'))}</span></div>
      <div><b data-count="${updated}">${updated}</b><span>${esc(t('updated'))}</span></div>
      ${mode === 'replace' ? `<div><b data-count="${removed}">${removed}</b><span>${esc(t('removed'))}</span></div>` : ''}</div>`);
  countUp($overlay);
  if (location.hash === '#backup') drawBackupCard();
}

const WEEKDAYS = { en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], so: ['Axad', 'Isniin', 'Talaado', 'Arbaco', 'Khamiis', 'Jimco', 'Sabti'], zh: ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'] };
function ago(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return t('just now');
  if (s < 3600) return t('{n} min ago', { n: Math.round(s / 60) });
  if (s < 86400) return t('{n} h ago', { n: Math.round(s / 3600) });
  const d = Math.round(s / 86400);
  if (d < 31) return t(d === 1 ? '{n} day ago' : '{n} days ago', { n: d });
  const m = Math.round(d / 30.4);
  if (m < 12) return t(m === 1 ? '{n} month ago' : '{n} months ago', { n: m });
  const y = Math.round(d / 365);
  return t(y === 1 ? '{n} year ago' : '{n} years ago', { n: y });
}

      let first = '', pinFirst = '', pattern = '';
      const step = (n, title, sub, body, acts) => {
        const el = this.mount(this.frame(`<div class="lk-steps">${[0, 1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div><div class="lk-msg" id="lkMsg">${esc(title)}</div><div class="lk-sub" id="lkSub">${esc(sub)}</div><div class="lk-card" id="lkCard">${body}</div>`, `${acts || ''}<span class="lk-b" id="lkX">${esc(t('Cancel'))}</span>`));
        el.querySelector('#lkX').onclick = () => this.close(false);
        return el;
      };
      const drawPat = () => {
        const el = step(0, t('Draw a new pattern'), t('Connect at least 4 dots'), '<div class="pp" id="lkPad"></div>');
        const p = this.pad(el.querySelector('#lkPad'), (v, len) => {
          if (len < 4) { el.querySelector('#lkMsg').textContent = t('Connect at least 4 dots'); el.querySelector('#lkMsg').classList.add('bad'); return p.reset('bad'); }
          first = v; p.reset('good'); setTimeout(confirmPat, 450);
        });
      };
      const confirmPat = () => {
        const el = step(1, t('Draw the same pattern again'), t('To make sure you remember it'), '<div class="pp" id="lkPad"></div>');
        const p = this.pad(el.querySelector('#lkPad'), v => {
          if (v !== first) { const m = el.querySelector('#lkMsg'); m.textContent = t('Not the same — start again'); m.classList.add('bad'); p.reset('bad'); setTimeout(drawPat, 900); return; }
          pattern = v; p.reset('good'); setTimeout(pin1, 450);
        });
      };
      const pin1 = () => { const el = step(2, t('Choose a 6-digit backup PIN'), t('Use it if you forget the pattern'), '<div id="lkPad"></div>'); this.pin(el.querySelector('#lkPad'), v => { pinFirst = v; pin2(); }); };
      const pin2 = () => {
        const el = step(2, t('Enter the PIN again'), '', '<div id="lkPad"></div>');
        this.pin(el.querySelector('#lkPad'), async v => {
          if (v !== pinFirst) { const m = el.querySelector('#lkMsg'); m.textContent = t('Not the same — start again'); m.classList.add('bad'); el.querySelector('#lkCard').classList.add('shake'); setTimeout(pin1, 900); return; }
          await save(null); face();
        });
      };
      const save = async faceId => {
        const salt = this.b64(crypto.getRandomValues(new Uint8Array(16)));
        await DB.setKV('lock', { salt, hash: await this.hash(pattern, salt), pin: await this.hash(pinFirst, salt), face: faceId, at: Date.now() });
        await DB.setKV('lockFails', 0); await DB.setKV('lockUntil', 0);
      };
      const face = async () => {
        if (!await this.faceOk()) return this.close(true);
        const el = step(3, t('Unlock with Face ID?'), t('Faster than drawing the pattern. Your pattern and PIN keep working.'), `<div style="width:220px;height:150px;display:flex;align-items:center;justify-content:center">${ic('scan', '#fff', 70, 1.6)}</div>`,
          `<span class="lk-b main" id="lkYes">${esc(t('Use Face ID'))}</span><span class="lk-b" id="lkNo">${esc(t('Not now'))}</span>`);
        el.querySelector('#lkX').style.display = 'none';
        el.querySelector('#lkNo').onclick = () => this.close(true);
        el.querySelector('#lkYes').onclick = async () => {
          try { const id = await this.faceCreate(); const c = this.cfg(); await DB.setKV('lock', Object.assign({}, c, { face: id })); toast(t('Face ID is on ✓')); }
          catch (e) { toast(t('Face ID could not be turned on')); }
          this.close(true);
        };
      };
      drawPat();
    });
  }
};
// Settings → Security
async function drawLockCard() {
  const el = document.getElementById('lockCard'); if (!el) return;
  if (document.body.classList.contains('pc')) { el.style.display = 'none'; return; }
  const c = Lock.cfg(), faceOk = await Lock.faceOk(), after = DB.kv.lockAfter == null ? 60000 : DB.kv.lockAfter;
  const head = `<div class="card-head"><div class="card-title"><div class="icon-tile">${ic('shield', B(), 16)}</div>${esc(t('Lock screen'))}</div>${c ? `<span class="chip green">${esc(t('On'))}</span>` : ''}</div>`;
  if (!c) {
    el.innerHTML = head + `<div class="hint" style="line-height:1.55;margin:-4px 0 12px">${esc(t('Lock Trade with a pattern, a backup PIN and Face ID. Your products stay private even if someone else holds your phone.'))}</div>
      <button class="btn primary" id="lkOn">${ic('shield', '#fff', 17)}${esc(t('Set up lock'))}</button>`;
  } else {
    el.innerHTML = head + `
      ${faceOk ? `<div class="setrow"><div class="icon-tile">${ic('scan', B(), 16)}</div><div style="flex:1"><div style="font-weight:700;font-size:14px">${esc(t('Face ID'))}</div><div class="hint">${esc(t('Unlock with your face'))}</div></div><div class="switch ${c.face ? 'on' : ''}" id="lkFaceSw"></div></div>` : ''}
      <div class="setrow" style="flex-direction:column;align-items:stretch;gap:8px"><div style="font-weight:700;font-size:14px">${esc(t('Lock after leaving the app'))}</div>
        <div class="seg" id="lkAfter">${[[0, 'Immediately'], [60000, '1 min'], [300000, '5 min']].map(x => `<span data-a="${x[0]}" class="${after === x[0] ? 'on' : ''}">${esc(t(x[1]))}</span>`).join('')}</div></div>
      <div class="row-btns" style="margin-top:8px"><button class="btn sm soft" id="lkChange">${esc(t('Change pattern & PIN'))}</button><button class="btn sm danger" id="lkOff">${esc(t('Turn off'))}</button></div>`;
  }
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('lkOn', async () => { if (await Lock.setup()) toast(t('Lock is on ✓')); drawLockCard(); });
  on('lkChange', async () => { if (await Lock.show(true) && await Lock.setup()) toast(t('Saved ✓')); drawLockCard(); });
  on('lkOff', async () => { if (await Lock.show(true)) { await DB.setKV('lock', null); toast(t('Lock is off')); } drawLockCard(); });
  on('lkFaceSw', async () => {
    const cur = Lock.cfg(); if (!cur) return;
    if (cur.face) { if (await Lock.show(true)) await DB.setKV('lock', Object.assign({}, cur, { face: null })); }
    else { try { await DB.setKV('lock', Object.assign({}, cur, { face: await Lock.faceCreate() })); toast(t('Face ID is on ✓')); } catch (e) { toast(t('Face ID could not be turned on')); } }
    drawLockCard();
  });
  document.querySelectorAll('#lkAfter span').forEach(sp => sp.onclick = async () => { await DB.setKV('lockAfter', Number(sp.dataset.a)); drawLockCard(); });
}

// ---------- pages/wishlist: things you like, written by you (kept on the computer and every paired device) ----------
const wishes = {
  all() { return DB.wishes.slice(); },
  get(id) { return DB.wishes.find(w => w.id === id); },
  async save(w) {
    const i = DB.wishes.findIndex(x => x.id === w.id);
    i >= 0 ? DB.wishes[i] = w : DB.wishes.push(w);
    await DB.write('wishes', 'put', w);
  },
  async remove(id) { DB.wishes = DB.wishes.filter(w => w.id !== id); await DB.write('wishes', 'delete', id); }
};
let wishTab = 'want';
const newWishId = () => 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
// Wishlist: one line to add, a photo grid, tap the circle when you got it
function renderWishlist() {
  simpleNav(''); tabbar('wishlist');
  const all = wishes.all(), want = all.filter(w => !w.done), got = all.filter(w => w.done);
  $body.innerHTML = `<div class="wl2-top">
      <div class="wl2-h"><span class="hb">${ic('heart', '#fff', 19, 2.6)}</span>${esc(t('Wishlist'))}</div>
      <div class="wl2-s">${esc(t('{a} you want · {b} you got', { a: want.length, b: got.length }))}</div>
      <div class="wl2-add"><input id="wlNew" placeholder="${esc(t('What do you like? Type it here…'))}" maxlength="120" enterkeyhint="done">
        <span class="cam" id="wlCam">${ic('camera', B(), 19)}</span><span class="go" id="wlGo">${ic('plus', '#fff', 20, 2.8)}</span></div>
    </div>
    <div class="seg wl2-seg" id="wlTabs">${[['want', 'Still want', want.length], ['got', 'Got it', got.length]].map(x => `<span data-w="${x[0]}" class="${wishTab === x[0] ? 'on' : ''}">${esc(t(x[1]))} · ${x[2]}</span>`).join('')}</div>
    <div class="wl2-grid" id="wlList"></div>
    <input type="file" id="wlFile" accept="image/*" hidden>`;
  const inp = document.getElementById('wlNew');
  const add = async image => {
    const title = norm(inp.value) || (image ? t('Something I like') : '');
    if (!title) { inp.focus(); return toast(t('Write what you like first')); }
    const w = { id: newWishId(), title, note: '', price: '', currency: '¥', priority: 2, image: image || '', link: '', done: false, createdAt: Date.now() };
    await wishes.save(w); inp.value = ''; wishTab = 'want';
    renderWishlist();
    const card = document.querySelector(`[data-wid="${w.id}"]`); if (card) card.classList.add('new');
    toast(t('Added to your wishlist ♥'));
  };
  inp.onkeydown = e => { if (e.key === 'Enter') add(); };
  document.getElementById('wlGo').onclick = () => add();
  document.getElementById('wlCam').onclick = () => document.getElementById('wlFile').click();
  document.getElementById('wlFile').onchange = async e => {
    const fl = e.target.files[0]; e.target.value = ''; if (!fl) return;
    try { add(DB.kv.noCrop ? await compress(fl, 900, 0.8) : (await compress(fl, 900, 0.8, true)).src); } catch (err) { toast(t('Could not read one photo')); }
  };
  document.querySelectorAll('#wlTabs span').forEach(el => el.onclick = () => { wishTab = el.dataset.w; renderWishlist(); });
  drawWishes();
}
function drawWishes() {
  const el = document.getElementById('wlList'); if (!el) return;
  const list = wishes.all().filter(w => wishTab === 'got' ? w.done : !w.done).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  if (!list.length) {
    el.innerHTML = `<div class="wl2-empty"><div class="big">${ic('heart', '#fff', 38, 2)}</div>
      <div class="empty-title">${esc(t(wishTab === 'got' ? 'Nothing ticked yet' : 'Your wishlist is empty'))}</div>
      <div class="muted">${esc(t(wishTab === 'got' ? 'When you get something, tap its circle and it moves here.' : 'Type anything you like above, or tap the camera to add it with a photo.'))}</div></div>`;
    return;
  }
  el.innerHTML = list.map(w => `<div class="wi ${w.done ? 'done' : ''}" data-wid="${w.id}">
      ${w.image ? `<img class="pic" src="${w.image}" loading="lazy">` : `<div class="pic ph" style="--h:${hueOf(w.title)}">${esc((w.title || '?').trim().charAt(0).toUpperCase())}</div>`}
      <span class="ck" data-tick="${w.id}">${ic('check', w.done ? '#fff' : '#94A3B8', 16, 3)}</span>
      <div class="tx"><div class="tt" data-notr>${esc(w.title)}</div>${Number(w.price) > 0 ? `<div class="pr">${esc(w.currency || '¥')}${esc(TradeReport.money(Number(w.price)))}</div>` : ''}</div></div>`).join('');
  stagger(el);
  el.querySelectorAll('.wi').forEach(c => c.onclick = e => { if (!e.target.closest('[data-tick]')) editWish(c.dataset.wid); });
  el.querySelectorAll('[data-tick]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const w = wishes.get(b.dataset.tick); if (!w) return;
    const card = b.closest('.wi'); card.classList.add('pop'); card.classList.toggle('done', !w.done);
    b.innerHTML = ic('check', !w.done ? '#fff' : '#94A3B8', 16, 3);
    await wishes.save(Object.assign({}, w, { done: !w.done, doneAt: w.done ? 0 : Date.now() }));
    if (!w.done) toast(t('Nice — you got it ✓'));
    setTimeout(() => card.classList.add('bye'), 380);
    setTimeout(() => renderWishlist(), 700);
  });
}

      </div>

      ${old ? `<div class="we-acts">

      <div class="sheet-actions"><button class="btn" id="weNo">${esc(t('Cancel'))}</button><button class="btn primary" id="weOk">${ic('heart', '#fff', 16, 2.6)}${esc(t('Save'))}</button></div>
      <input type="file" id="weFile" accept="image/*" hidden>
    </div></div>`;

    document.getElementById('wem').onclick = closeOverlay;

    document.getElementById('weFile').onchange = async e => {

      const ph = document.getElementById('wePhoto'); ph.innerHTML = '<div class="spinner" style="width:24px;height:24px;border-width:3px"></div>';
      try { const r = DB.kv.noCrop ? await compress(f, 900, 0.8) : (await compress(f, 900, 0.8, true)).src; w.image = r; } catch (err) { toast(t('Could not read one photo')); }
      draw();
    };
    document.getElementById('weOk').onclick = async () => {
      keep();
      const title = norm(w.title);
      if (!title) return toast(t('Write what you like first'));
      const rec = Object.assign({}, old || {}, w, { id: old ? old.id : newWishId(), title, note: String(w.note || '').trim(), link: String(w.link || '').trim(),
        price: Number(w.price) > 0 ? String(Number(w.price)) : '', createdAt: old ? old.createdAt : Date.now() });
      await wishes.save(rec); closeOverlay(); toast(t('Saved ✓')); renderWishlist();
    };

      await wishes.remove(old.id); toast(t('Removed')); renderWishlist();
    };
    const pr = document.getElementById('weProd'); if (pr) pr.onclick = () => { keep(); wishToProduct = Object.assign({}, w); closeOverlay(); location.hash = 'add'; };

// On the computer, while no phone is linked, the whole screen is one QR code. The phone scans it, and the computer
// opens with the phone's products. Unlinking the last phone brings this screen back (nothing is deleted).
const PcLogin = {
  el: null, t: null,
  need() { const s = Sync.server; return !!(s && s.key && Array.isArray(s.phones) && !s.phones.length && !s.github); },
  check() { if (this.need()) this.show(); else this.hide(); },
  show() {
    const info = Sync.server;
    if (!this.el) {
      this.el = document.createElement('div'); this.el.id = 'pcLogin'; document.body.appendChild(this.el);
      this.el.innerHTML = `<div class="pl-band"><div class="pl-brand">${ic('devices', '#fff', 20, 2.2)}<b>Trade</b><span>${esc(t('on this computer'))}</span></div></div>
        <div class="pl-card">
          <div class="pl-left">
            <h1>${esc(t('Use Trade on this computer'))}</h1>
            <div class="iph-steps pl-steps">
              <div><i>1</i><span>${esc(t('Open Trade on your iPhone'))}</span></div>
              <div><i>2</i><span>${esc(t('Go to Settings → Use on another device'))}</span></div>
              <div><i>3</i><span>${esc(t('Tap Scan QR code and point the phone at this screen'))}</span></div>
            </div>
            <div class="pl-note">${ic('phone', B(), 16)}<span>${esc(t('Your iPhone is the parent: it keeps your products, even offline. This computer shows them and syncs live while they are connected.'))}</span></div>
            <div class="hint pl-warn" id="plWarn"></div>
            ${wifiCertHtml(info)}
            <details class="lk-alt"><summary>${esc(t('Can’t scan? Type the code instead'))}</summary>
              <div class="pinbox"><div class="k">${esc(t('In Trade on the phone: Settings → Use on another device → type'))}</div>
              <div class="pin" id="plPin" data-notr></div><div class="hint">${esc(t('Changes every 10 minutes'))}</div></div></details>
            <details class="lk-alt"><summary>${esc(t('Or open with the link from your iPhone'))}</summary>
              <div class="hint" style="margin:8px 2px">${esc(t('On the iPhone: Settings → Storage → GitHub → Link for the computer. Paste it here.'))}</div>
              <input class="input" id="plGh" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://…#gh=…" style="margin-bottom:8px" data-notr>
              <button class="btn primary sm" id="plGhGo">${esc(t('Open'))}</button></details>
          </div>
          <div class="pl-right"><div class="lk-qr pl-qr" id="plQr"></div><div class="hint" style="text-align:center;margin-top:10px">${esc(t('The code changes every minute'))}</div></div>
        </div>
        <div class="pl-foot" data-notr>${esc(t('iPhone app'))}: <b>https://mitm00.github.io/TradeApp/</b></div>`;
      paintWifiCert(info);
      document.getElementById('plGhGo').onclick = () => {
        const L = Cloud.parseLink(document.getElementById('plGh').value);
        if (!L) return dialog({ title: 'GitHub', text: t('This is not the link from Trade on the iPhone'), ok: t('OK'), cancel: false });
        Cloud.openLink(L).catch(e => dialog({ title: 'GitHub', text: e.message, ok: t('OK'), cancel: false }));
      };
    }
    this.paint(info);
    clearInterval(this.t);
    this.t = setInterval(async () => {
      try {
        const j = await (await fetch('api/sync/info', { cache: 'no-store' })).json(); if (!j.key) return;
        const fresh = j.link !== (Sync.server || {}).link || j.publicUrl !== (Sync.server || {}).publicUrl;
        Sync.server = j;
        if (!this.need()) { toast(t('{x} linked ✓ — syncing', { x: (j.lastLinked || {}).name || 'iPhone' })); this.hide(); Sync.run(); route(true); return; }
        if (fresh) this.paint(j); else { const p = document.getElementById('plPin'); if (p) p.textContent = fmtPin(j.pin); }
      } catch (e) {}
    }, 2500);
  },
  paint(info) {
    const txt = linkText(info), w = document.getElementById('plWarn'), p = document.getElementById('plPin');
    if (p) p.textContent = fmtPin(info.pin);
    if (w) w.textContent = !info.publicUrl ? t('iPhone: start Trade on this computer with npm run iphone, so the iPhone app can reach it.') : '';
    if (txt) loadQr().then(() => { const q = document.getElementById('plQr'); if (q) { q.innerHTML = ''; new QRCode(q, { text: txt, width: 264, height: 264, correctLevel: QRCode.CorrectLevel.M }); } })
      .catch(() => { const q = document.getElementById('plQr'); if (q) q.innerHTML = `<div class="hint">${esc(t('QR needs internet once'))}</div>`; });
  },
  hide() { clearInterval(this.t); if (this.el) { this.el.remove(); this.el = null; } }
};

// ---------- start ----------
(async () => {
  await DB.init();
  if (!DB.kv.lang) { const nl = (navigator.language || 'en').toLowerCase(); await DB.setKV('lang', nl.startsWith('zh') ? 'zh' : nl.startsWith('so') ? 'so' : 'en'); }
  applyLang(DB.kv.lang);
  applyTheme(DB.kv.theme || 'cherry');
  document.body.classList.toggle('noanim', !!DB.kv.noanim);
  Lock.init();
  await Folder.init();
  // Opened with the link from the iPhone (#gh=…): take it out of the address first, so it is not kept in history
  const ghL = Cloud.parseLink(location.hash);
  if (ghL) history.replaceState(null, '', location.pathname);
  route();
  const ready = Sync.init();
  Cloud.init();
  if (ghL) ready.then(() => Cloud.openLink(ghL)).catch(e => dialog({ title: 'GitHub', text: e.message, ok: t('OK'), cancel: false }));
  if (!await Persist.check()) Persist.ask();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setTimeout(() => Install.show(), 1200);
})();
</script>
</body>
</html>
